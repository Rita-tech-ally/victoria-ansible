plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1

# Sirf running instances ko uthayega
filters:
  instance-state-name: running

# Host identity aur SSH connection details
hostnames:
  - public_ip_address

compose:
  ansible_host: public_ip_address
  ansible_user: ubuntu
  ansible_ssh_private_key_file: /var/lib/jenkins/workspace/victoria-ansible-deploy/sakshi.pem

# Tag ke basis par clean groups banane ke liye
keyed_groups:
  - key: tags.Name
    separator: ""

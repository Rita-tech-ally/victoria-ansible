---
# General deployment configs
app_base_dir: "/opt/ot-microservices"
app_user: "appuser"
app_group: "appuser"

# Service Toggles
enable_employee_api: true
enable_salary_api: true
enable_attendance_api: true
enable_frontend: true

# Internal Service Ports
employee_api_port: 8081
salary_api_port: 8082
attendance_api_port: 8083

# Nginx & Frontend Configuration
nginx_port: 80
server_name: "_"
frontend_build_path: "{{ app_base_dir }}/frontend/build"

# Backend Bind Hosts (Defaults to local host if on same server)
employee_api_host: "127.0.0.1"
salary_api_host: "127.0.0.1"
attendance_api_host: "127.0.0.1"

# Database & Cache Dynamic Discovery (Pulls from inventory groups, fallbacks to localhost)
scylla_host: "{{ hostvars[groups['scylladb'][0]]['ansible_host'] | default('127.0.0.1') if 'scylladb' in groups and groups['scylladb'] | length > 0 else '127.0.0.1' }}"
scylla_port: 9042
scylla_keyspace: "employee_db"
scylla_user: "scylladb"
scylla_password: "password"

postgres_host: "{{ hostvars[groups['postgres'][0]]['ansible_host'] | default('127.0.0.1') if 'postgres' in groups and groups['postgres'] | length > 0 else '127.0.0.1' }}"
postgres_port: 5432
postgres_db: "attendance_db"
postgres_user: "postgres"
postgres_password: "password"

redis_host: "{{ hostvars[groups['redis'][0]]['ansible_host'] | default('127.0.0.1') if 'redis' in groups and groups['redis'] | length > 0 else '127.0.0.1' }}"
redis_port: 6379
redis_password: ""

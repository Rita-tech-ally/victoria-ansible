---
- name: Ensure application service group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Ensure application service user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create base project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_base_dir }}"
    - "{{ app_base_dir }}/employee-api"
    - "{{ app_base_dir }}/salary-api"
    - "{{ app_base_dir }}/attendance-api"
    - "{{ app_base_dir }}/frontend"
